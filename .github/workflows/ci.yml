name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (zero warnings)
        # `npm run lint` ahora usa --max-warnings=0 (package.json), así
        # que cualquier warning nuevo (unused import, exhaustive-deps,
        # etc.) bloquea el merge. Baseline cerrado en PR #108.
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: TypeScript strict check (audited files only)
        # Opt-in incremental adoption del Bloque 3.a (noUncheckedIndexedAccess).
        # tsconfig.strict.json lista archivos auditados — TS exige `!`/guards
        # en cada arr[i]. Bloquea regresión en código ya endurecido sin
        # imponer el flag global todavía. Ver tsconfig.strict.json para detalles.
        run: npm run typecheck:strict-audited

      - name: Seed/schema sync check
        run: npm run check:sync

      - name: Seed and config data quality
        run: npm run check:data-quality

      - name: Dependency security audit
        run: npm run check:security

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npx vite build

      - name: Check bundle size budgets
        run: npm run check:bundle

      # NOTE security: este workflow no consume payloads controlados por
      # usuario (issue title, PR body, commit message). Solo usa
      # github.event_name que es un literal del runtime ('push' o
      # 'pull_request') — no es vector de injection.
      - name: Lighthouse CI
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true

      - name: Install Playwright (E2E)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (PR — full suite, bloqueante)
        if: github.event_name == 'pull_request'
        run: npx playwright test

      - name: Run E2E critical (push main — smoke post-merge, non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm run test:e2e:critical

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: npricing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:pw@localhost:5432/npricing_test
      PGPASSWORD: pw

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then exit 0; fi
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Apply migrations via runner
        # Llama al MISMO runner que el server arranca al boot
        # (`server/migrationRunner.ts`). El bootstrap Supabase-compat
        # (auth schema, anon/authenticated/service_role, supabase_realtime)
        # se aplica internamente — ya no se duplica aquí. El runner falla
        # con exit ≠ 0 en la primera migration que rompa, evitando el
        # silent-failure histórico del loop bash `for f in ...; psql ...; done`
        # (el `for` no tenía `set -e`, los errores se imprimían y se ignoraban).
        run: npx tsx scripts/apply-migrations.ts

      - name: Run integration tests
        run: npx vitest run utils/__tests__/integration
